<title>n4spb Area Map</title>

<style>
  /* Layout: one orientation map of the whole city with the lettered areas pinned on it, a legend of the areas beside it, and a zoomed inset of the centre where the areas are drawn to scale.
     Palette: a green-grey land, blue water and one vivid colour per area (A orange, B violet); nothing else on the map is saturated except the metro lines. */
  :root {
    --bg: #eef2f0; --panel: #ffffff; --ink: #13211e; --mute: #536560; --line: #d2dbd7;
    --land: #e6ebe5; --sea: #c8dfec; --water-line: #a4c8dd; --veil: rgba(238, 242, 240, 0.58);
    --boundary: #7d8f88; --district: #b9c6c0; --kad: #55655f; --kad-case: #f4f7f5; --street: #c3cbc6; --street-major: #aab5af; --park: #d3e2cc; --rail: #b4bdb8;
    --label: #2a3b36; --label-halo: rgba(246, 249, 247, 0.92); --water-label: #3b7699;
    --A: #d94a08; --A-ink: #ffffff; --B: #6540d1; --B-ink: #ffffff;
    --chip: #e3eae6; --ok: #1f7a4d; --wip: #a35b00; --focus: #0b63ce;
    --font-ui: 'Golos Text', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-map: 'IBM Plex Sans Condensed', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1514; --panel: #141c1b; --ink: #e5eeeb; --mute: #92a39d; --line: #2a3633;
      --land: #1b2422; --sea: #0d2230; --water-line: #28506b; --veil: rgba(14, 21, 20, 0.62);
      --boundary: #5a6d66; --district: #34423e; --kad: #8da09a; --kad-case: #0e1514; --street: #2c3835; --street-major: #3d4d48; --park: #1f3128; --rail: #3b4743;
      --label: #d3dfdb; --label-halo: rgba(14, 21, 20, 0.88); --water-label: #6fb0d6;
      --A: #ff8a4c; --A-ink: #1b0e06; --B: #a78dff; --B-ink: #120a2b;
      --chip: #202b29; --ok: #55d29a; --wip: #f0b55a; --focus: #7db4ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1514; --panel: #141c1b; --ink: #e5eeeb; --mute: #92a39d; --line: #2a3633;
    --land: #1b2422; --sea: #0d2230; --water-line: #28506b; --veil: rgba(14, 21, 20, 0.62);
    --boundary: #5a6d66; --district: #34423e; --kad: #8da09a; --kad-case: #0e1514; --street: #2c3835; --street-major: #3d4d48; --park: #1f3128; --rail: #3b4743;
    --label: #d3dfdb; --label-halo: rgba(14, 21, 20, 0.88); --water-label: #6fb0d6;
    --A: #ff8a4c; --A-ink: #1b0e06; --B: #a78dff; --B-ink: #120a2b;
    --chip: #202b29; --ok: #55d29a; --wip: #f0b55a; --focus: #7db4ff;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 28px; }
  .page { max-width: 1240px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
  h1, h2, p, ul, dl, dd, figure { margin: 0; }
  ul { padding: 0; list-style: none; }
  code { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 0.92em; }

  .top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
  .kicker { font-family: var(--font-map); font-weight: 600; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); }
  h1 { font-family: var(--font-map); font-weight: 700; font-size: clamp(26px, 4.4vw, 38px); line-height: 1.05; letter-spacing: -0.005em; text-wrap: balance; }
  .lede { margin-top: 6px; color: var(--mute); max-width: 62ch; text-wrap: pretty; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .seg button { font: 600 12px/1 var(--font-map); letter-spacing: 0.08em; padding: 8px 12px; border: 0; background: transparent; color: var(--mute); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mute); cursor: pointer; user-select: none; }
  .chk input { accent-color: var(--ink); width: 15px; height: 15px; margin: 0; }
  button:focus-visible, .chk input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; align-items: stretch; }
  .card { display: flex; flex-direction: column; }
  .card .stage { flex: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card h2 { font-family: var(--font-map); font-weight: 600; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  .card-head span { font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  /* ---- the maps */
  .stage { position: relative; background: var(--sea); line-height: 0; }
  .stage svg { display: block; width: 100%; height: auto; }
  .stage .overlay { position: absolute; inset: 0; pointer-events: none; line-height: 1.2; }
  .overlay > * { position: absolute; }
  .lnd { fill: var(--land); }
  .sea, .water { fill: var(--sea); }
  .river { fill: none; stroke: var(--sea); stroke-linecap: round; stroke-linejoin: round; }
  .river.major { stroke-width: 2.4px; }
  .river.minor { stroke-width: 1px; }
  .veil { fill: var(--veil); }
  .boundary { fill: none; stroke: var(--boundary); stroke-width: 1px; stroke-dasharray: 5 3; }
  .district { fill: none; stroke: var(--district); stroke-width: 0.8px; }
  .kad-case { fill: none; stroke: var(--kad-case); stroke-width: 3.4px; stroke-linejoin: round; }
  .kad { fill: none; stroke: var(--kad); stroke-width: 1.5px; stroke-linejoin: round; }
  .zsd { fill: none; stroke: var(--kad); stroke-width: 1.2px; stroke-dasharray: 4 3; }
  .metro { fill: none; stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
  .station { fill: var(--panel); stroke: var(--ink); stroke-width: 0.8px; }
  .frame { fill: none; stroke: var(--ink); stroke-width: 1.2px; stroke-dasharray: 4 3; }
  .park { fill: var(--park); }
  .street { fill: none; stroke: var(--street); stroke-width: 1px; stroke-linecap: round; stroke-linejoin: round; }
  .street.major { stroke: var(--street-major); stroke-width: 1.6px; }
  .rail { fill: none; stroke: var(--rail); stroke-width: 1.2px; stroke-dasharray: 5 2; }
  .area-fill { stroke-width: 1.6px; stroke-linejoin: round; }
  .area-fill.A { fill: color-mix(in srgb, var(--A) 34%, transparent); stroke: var(--A); }
  .area-fill.B { fill: color-mix(in srgb, var(--B) 34%, transparent); stroke: var(--B); }
  .band { fill: url(#hatch); }
  .gate { stroke: var(--ink); stroke-width: 3px; stroke-linecap: butt; }
  .leader { stroke-width: 1.5px; }
  .leader.A { stroke: var(--A); } .leader.B { stroke: var(--B); }
  .lyr-hidden { display: none; }
  [data-area] { transition: opacity 0.15s; }
  .dim { opacity: 0.28; }

  .lbl { font-family: var(--font-map); font-weight: 500; font-size: 12px; color: var(--label); white-space: nowrap;
    text-shadow: 0 0 3px var(--label-halo), 0 0 3px var(--label-halo), 0 0 2px var(--label-halo), 0 0 6px var(--label-halo); }
  .lbl.sm { font-size: 11px; }
  .lbl.city { font-weight: 600; letter-spacing: 0.04em; }
  .lbl.water { color: var(--water-label); font-style: italic; text-shadow: none; }
  .lbl.street { letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px; font-weight: 600; color: var(--mute); }
  .lbl.dist { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
  .dot { width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--ink); border: 1.5px solid var(--panel); box-sizing: content-box; padding: 0; transform: translate(-1.5px, -1.5px); }
  .badge { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-family: var(--font-map); font-weight: 700; font-size: 15px; line-height: 1; border: 2px solid var(--panel); }
  .badge.A { background: var(--A); color: var(--A-ink); } .badge.B { background: var(--B); color: var(--B-ink); }
  .pin { pointer-events: auto; cursor: default; transform: translate(-50%, -50%); }
  .pin .badge { width: 28px; height: 28px; font-size: 16px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35); }
  .pin.big .badge { width: 40px; height: 40px; font-size: 22px; }
  .pin:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 50%; }
  .tick { height: 1.5px; transform-origin: 0 50%; }
  .tick.A { background: var(--A); } .tick.B { background: var(--B); }
  .zoom-tag { font-family: var(--font-map); font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; transform: translate(0, -100%); }
  .scale { position: absolute; left: 10px; bottom: 8px; display: flex; flex-direction: column; gap: 2px; font-family: var(--font-map); font-size: 11px; color: var(--label); line-height: 1.1; pointer-events: none; text-shadow: 0 0 3px var(--label-halo), 0 0 3px var(--label-halo); }
  .scale i { display: block; height: 5px; border: 1.5px solid var(--label); border-top: 0; }
  .north { position: absolute; right: 10px; top: 8px; display: grid; justify-items: center; font-family: var(--font-map); font-weight: 700; font-size: 12px; color: var(--label); line-height: 1; pointer-events: none; text-shadow: 0 0 3px var(--label-halo), 0 0 3px var(--label-halo); }
  .north::after { content: ''; width: 0; height: 0; order: -1; border: 5px solid transparent; border-bottom: 11px solid var(--label); border-top: 0; margin-bottom: 2px; }
  .maptip { padding: 9px 14px 11px; border-top: 1px solid var(--line); font-size: 12px; color: var(--mute); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .maptip .sw { display: inline-flex; align-items: center; gap: 6px; }
  .maptip .sw::before { content: ''; width: 16px; height: 0; border-top: 2px solid var(--c, var(--ink)); }
  .maptip .sw.dash::before { border-top-style: dashed; }

  /* ---- the legend of areas */
  .areas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 12px; }
  .area-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; border-left: 5px solid var(--c); }
  .area-card[data-area="A"] { --c: var(--A); } .area-card[data-area="B"] { --c: var(--B); }
  .area-card .badge { width: 40px; height: 40px; font-size: 22px; border: 0; }
  .ac-title { font-family: var(--font-map); font-weight: 700; font-size: 20px; line-height: 1.1; }
  .ac-title small { display: block; margin-top: 2px; font-weight: 500; font-size: 13px; color: var(--mute); letter-spacing: 0.02em; }
  .ac-sights { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .ac-sights li { background: var(--chip); border-radius: 4px; padding: 2px 7px; font-size: 12px; }
  .ac-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 14px; margin-top: 12px; }
  .ac-meta dt { font-family: var(--font-map); font-weight: 600; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
  .ac-meta dd { font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
  .pill.ok { color: var(--ok); } .pill.wip { color: var(--wip); }
  .border-note { font-size: 12.5px; color: var(--mute); padding: 0 2px; text-wrap: pretty; }
  .foot { font-size: 12px; color: var(--mute); display: flex; flex-wrap: wrap; gap: 4px 18px; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 700px) {
    .r2 { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { [data-area] { transition: none; } }
</style>

<main class="page" id="page">
  <header class="top">
    <div>
      <p class="kicker">n4spb · areas of the scene</p>
      <h1>Area map of Saint Petersburg</h1>
      <p class="lede">Every lettered area is its own page of the scene. Two exist so far, A and B. The letters sit on the city; the zoomed map shows their real outlines.</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Label language">
        <button type="button" id="lang-en" aria-pressed="true">EN</button>
        <button type="button" id="lang-ru" aria-pressed="false">RU</button>
      </div>
      <label class="chk" for="t-metro"><input id="t-metro" type="checkbox" checked> Metro</label>
      <label class="chk" for="t-ring"><input id="t-ring" type="checkbox" checked> Ring road</label>
      <label class="chk" for="t-dist"><input id="t-dist" type="checkbox"> Districts</label>
    </div>
  </header>

  <ul class="areas" id="legend"></ul>
  <p class="border-note" id="border-note"></p>

  <div class="grid" id="grid">
    <section class="card" aria-labelledby="h-city">
      <div class="card-head"><h2 id="h-city">Whole city</h2><span id="city-size"></span></div>
      <figure class="stage" id="city"></figure>
      <div class="maptip" id="city-tip"></div>
    </section>

    <section class="card" aria-labelledby="h-inset">
      <div class="card-head"><h2 id="h-inset">Centre, to scale</h2><span id="inset-size"></span></div>
      <figure class="stage" id="inset"></figure>
      <div class="maptip" id="inset-tip"></div>
    </section>
  </div>

  <footer class="foot" id="foot"></footer>
</main>

    for (i = 0; i < c.places.length; i++) {
      var p = c.places[i], rk = p.r === 2 ? ' r2' : '', cls = (p.kind === 'city' ? 'lbl city' : (p.kind === 'water' ? 'lbl water' : 'lbl sm')) + rk;
      if (p.kind !== 'water') s += '<i class="dot' + rk + '" style="' + at(vb, p.x, p.y) + '"></i>';
      s += '<span class="' + cls + '" style="' + at(vb, p.x, p.y) + ';' + sideStyle(p.side) + '">' + esc(tr(p)) + '</span>';
    }
    for (i = 0; i < D.areas.length; i++) {
      var a = D.areas[i], q = a.pin, cx = a.cx, cz = a.cz, L = Math.hypot(q.dx, q.dy), ang = Math.atan2(q.dy, q.dx) * 180 / Math.PI;
      s += '<i class="tick ' + a.id + '" data-area="' + a.id + '" style="' + at(vb, cx, cz) + ';width:' + L.toFixed(1) + 'px;transform:rotate(' + ang.toFixed(2) + 'deg)"></i>';
      s += '<span class="pin" data-area="' + a.id + '" tabindex="0" role="img" aria-label="Area ' + a.id + ': ' + esc(a.titleEn) + '" style="' + at(vb, cx, cz) + ';margin:' + q.dy + 'px 0 0 ' + q.dx + 'px"><span class="badge ' + a.id + '">' + a.id + '</span></span>';
    }
    s += '<span class="zoom-tag" style="' + at(vb, D.inset.vb[0], D.inset.vb[1]) + '">Zoom</span>';
    return s;
  }

  function insetOverlay() {
    var n = D.inset, vb = n.vb, s = '', i;
    for (i = 0; i < n.waterLabels.length; i++) {
      var w = n.waterLabels[i];
      s += '<span class="lbl sm ' + w.cls + (w.r === 2 ? ' r2' : '') + '" style="' + at(vb, w.x, w.y) + ';transform:translate(-50%,-50%) rotate(' + w.a.toFixed(1) + 'deg)">' + esc(tr(w)) + '</span>';
    }
    for (i = 0; i < n.stations.length; i++) { /* stations are dots only */ }
    for (i = 0; i < n.places.length; i++) {
      var p = n.places[i];
      var rk2 = p.r === 2 ? ' r2' : '';
      s += '<i class="dot' + rk2 + '" style="' + at(vb, p.x, p.y) + '"></i><span class="lbl sm' + rk2 + '" style="' + at(vb, p.x, p.y) + ';' + sideStyle(p.side) + '">' + esc(tr(p)) + '</span>';
    }
    for (i = 0; i < D.areas.length; i++) {
      var a = D.areas[i];
      s += '<span class="pin big" data-area="' + a.id + '" tabindex="0" role="img" aria-label="Area ' + a.id + ': ' + esc(a.titleEn) + '" style="' + at(vb, a.bx, a.bz) + '"><span class="badge ' + a.id + '">' + a.id + '</span></span>';
    }
    if (D.gate) s += '<span class="lbl sm r2" style="' + at(vb, (D.gate.x0 + D.gate.x1) / 2, D.gate.z) + ';transform:translate(-50%,calc(-100% - 5px));font-weight:600">' + (lang === 'ru' ? 'граница A | B, ворота g1 / g2' : 'border A | B, gates g1 / g2') + '</span>';
    return s;
  }

  /* ---------------- scale bars ---------------- */
  function niceLen(maxM) {
    var p = Math.pow(10, Math.floor(Math.log10(maxM))), m = [5, 2, 1], i;
    for (i = 0; i < m.length; i++) if (m[i] * p <= maxM) return m[i] * p;
    return p;
  }
  function updateScale(stage, vbW) {
    var svg = stage.querySelector('svg'), sc = stage.querySelector('.scale');
    if (!svg || !sc) return;
    var ppm = svg.getBoundingClientRect().width / vbW;
    var len = niceLen(110 / ppm);
    sc.querySelector('i').style.width = (len * ppm).toFixed(1) + 'px';
    sc.querySelector('span').textContent = len >= 1000 ? (len / 1000) + ' km' : len + ' m';
  }

  /* ---------------- render ---------------- */
  var cityEl = document.getElementById('city'), insetEl = document.getElementById('inset');
  function renderMaps() {
    cityEl.style.aspectRatio = D.city.vb[2] + ' / ' + D.city.vb[3];
    insetEl.style.aspectRatio = D.inset.vb[2] + ' / ' + D.inset.vb[3];
    var tail = '<div class="scale"><span></span><i></i></div><div class="north">N</div>';
    cityEl.innerHTML = citySvg() + '<div class="overlay" id="city-ov">' + cityOverlay() + '</div>' + tail;
    insetEl.innerHTML = insetSvg() + '<div class="overlay" id="inset-ov">' + insetOverlay() + '</div>' + tail;
    applyLayers(); bindHover();
    updateScale(cityEl, D.city.vb[2]); updateScale(insetEl, D.inset.vb[2]);
  }
  function relabel() {
    document.getElementById('city-ov').innerHTML = cityOverlay();
    document.getElementById('inset-ov').innerHTML = insetOverlay();
    applyLayers(); bindHover(); renderLegend(); renderTexts();
  }

  function renderLegend() {
    var ul = document.getElementById('legend'), s = '';
    D.areas.forEach(function (a) {
      s += '<li class="area-card" data-area="' + a.id + '" tabindex="0">';
      s += '<span class="badge ' + a.id + '">' + a.id + '</span><div>';
      s += '<h2 class="ac-title" style="text-transform:none;letter-spacing:0;color:inherit">' + esc(lang === 'ru' ? a.title : a.titleEn) + '<small>' + esc(lang === 'ru' ? a.titleEn : a.title) + '</small></h2>';
      s += '<ul class="ac-sights">' + a.sights.map(function (x) { return '<li>' + esc(lang === 'ru' ? x.n : x.ne) + '</li>'; }).join('') + '</ul>';
      s += '<dl class="ac-meta">';
      s += '<div><dt>' + (lang === 'ru' ? 'Игровая площадь' : 'Play area') + '</dt><dd>' + a.km2.toFixed(2) + ' km²</dd></div>';
      s += '<div><dt>' + (lang === 'ru' ? 'Страница · загрузка' : 'Page · download') + '</dt><dd><code>' + esc(a.page) + '</code> · ~' + a.mb + ' MB</dd></div>';
      s += '<div><dt>' + (lang === 'ru' ? 'Статус' : 'Status') + '</dt><dd><span class="pill ' + a.statusKind + '">' + esc(lang === 'ru' ? a.statusRu : a.status) + '</span></dd></div>';
      s += '</dl></div></li>';
    });
    ul.innerHTML = s;
    bindHover();
  }

  function renderTexts() {
    var c = D.city;
    document.getElementById('city-size').textContent = f1(c.kmW) + ' × ' + f1(c.kmH) + ' km';
    document.getElementById('inset-size').textContent = f1(D.inset.vb[2] / 1000) + ' × ' + f1(D.inset.vb[3] / 1000) + ' km';
    document.getElementById('border-note').textContent = lang === 'ru' ? D.noteRu : D.note;
    document.getElementById('city-tip').innerHTML =
      '<span class="sw dash" style="--c:var(--boundary)">' + (lang === 'ru' ? 'граница города' : 'city boundary') + '</span>' +
      '<span class="sw" style="--c:var(--kad)">' + (lang === 'ru' ? 'КАД' : 'ring road (KAD)') + '</span>' +
      '<span class="sw" style="--c:#0078be">' + (lang === 'ru' ? 'метро' : 'metro') + '</span>' +
      '<span class="sw dash" style="--c:var(--ink)">' + (lang === 'ru' ? 'рамка увеличения' : 'zoom frame') + '</span>';
    document.getElementById('inset-tip').innerHTML =
      '<span class="sw" style="--c:var(--A)">' + (lang === 'ru' ? 'A: ' : 'A: ') + (lang === 'ru' ? 'Невский проспект' : 'Nevsky strip') + '</span>' +
      '<span class="sw" style="--c:var(--B)">B: ' + (lang === 'ru' ? 'Север' : 'North') + '</span>' +
      '<span>' + (lang === 'ru' ? 'Штриховка: полоса 200 м, входящая в обе области. Чёрная черта: граница с воротами g1 / g2.' : 'Hatched: the 200 m band that both areas contain. Black bar: the border with gates g1 / g2.') + '</span>';
    document.getElementById('foot').innerHTML = D.foot.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('');
  }

  /* ---------------- interaction ---------------- */
  function setHl(id) {
    var nodes = document.querySelectorAll('[data-area]');
    for (var i = 0; i < nodes.length; i++) {
      var on = !id || nodes[i].getAttribute('data-area') === id;
      nodes[i].classList.toggle('dim', !on);
    }
  }
  function bindHover() {
    var nodes = document.querySelectorAll('.pin, .area-card');
    for (var i = 0; i < nodes.length; i++) {
      (function (n) {
        var id = n.getAttribute('data-area');
        n.onmouseenter = n.onfocus = function () { setHl(id); };
        n.onmouseleave = n.onblur = function () { setHl(null); };
      })(nodes[i]);
    }
  }
  function applyLayers() {
    var map = { metro: 't-metro', ring: 't-ring', dist: 't-dist' };
    Object.keys(map).forEach(function (k) {
      var on = document.getElementById(map[k]).checked;
      var nodes = document.querySelectorAll('[data-lyr="' + k + '"]');
      for (var i = 0; i < nodes.length; i++) nodes[i].classList.toggle('lyr-hidden', !on);
    });
  }
  ['t-metro', 't-ring', 't-dist'].forEach(function (id) { document.getElementById(id).addEventListener('change', applyLayers); });

  function setLang(l) {
    lang = l;
    document.getElementById('lang-en').setAttribute('aria-pressed', l === 'en');
    document.getElementById('lang-ru').setAttribute('aria-pressed', l === 'ru');
    try { localStorage.setItem(KEY, l); } catch (e) { /* ignore */ }
    document.documentElement.lang = l;
    relabel();
  }
  document.getElementById('lang-en').addEventListener('click', function () { setLang('en'); });
  document.getElementById('lang-ru').addEventListener('click', function () { setLang('ru'); });

  renderMaps(); renderLegend(); renderTexts();
  if (lang === 'ru') setLang('ru');
  if (window.ResizeObserver) {
    new ResizeObserver(function () { updateScale(cityEl, D.city.vb[2]); updateScale(insetEl, D.inset.vb[2]); }).observe(cityEl);
  } else {
    window.addEventListener('resize', function () { updateScale(cityEl, D.city.vb[2]); updateScale(insetEl, D.inset.vb[2]); });
  }
})();
</script>
