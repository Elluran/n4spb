<style>body{margin:0;overflow:hidden;background:#b2cbe0;font:14px system-ui;color:#fff}canvas{display:block}#lab-tools{position:fixed;top:16px;left:16px;z-index:8;background:#18243bda;border-radius:10px;padding:12px;max-width:410px}#lab-tools strong{display:block;margin-bottom:8px}button{border:1px solid #a5b2c8;background:#26354e;color:white;padding:7px;border-radius:5px;cursor:pointer;margin:2px}#note{font-size:12px;margin-top:6px}#toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);z-index:9}@media(max-width:600px){#lab-tools{max-width:210px;font-size:12px}}</style></head>
<body><div id="lab-tools"><strong>Collision test yard</strong><button data-case="wall">Head-on</button><button data-case="pole">Offset pole</button><button data-case="parked">Parked car</button><button data-case="traffic">Oncoming car</button><div>Damage preview: <button data-stage="1">Scuffed</button><button data-stage="2">Dented</button><button data-stage="3">Crumpled</button><button data-stage="4">Wrecked</button></div><button id="reset">Reset & repair</button><button id="view">Inspect / drive</button><div id="note">WASD drive · Space drift · V camera · J repair when stopped</div></div><div id="toast"></div>
<script type="module">
import * as THREE from 'three';
import { Physics } from '/src/core/physics.js';
import { createMaterials } from '/src/core/materials.js';
import { build as buildDrive } from '/src/world/drive.js';
import { createTextures } from '/src/core/textures.js';
import { createFleet } from '/src/world/traffic/fleet.js';
import { ARCH } from '/src/world/traffic/fleetdata.js';
import { createDamageState } from '/src/world/drive/damage.js';
import { getCarWrecks } from '/src/world/drive/wrecks.js';
import { bindCarImpact, bindParkedImpact } from '/src/world/traffic/impact.js';

const renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(devicePixelRatio); renderer.shadowMap.enabled=true; document.body.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background=new THREE.Color('#b2cbe0'); scene.fog=new THREE.Fog('#b2cbe0',80,180);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.12,250); camera.layers.enableAll();
scene.add(new THREE.HemisphereLight('#e8f1ff','#6e727d',2.2));
const sun=new THREE.DirectionalLight('#fff2d8',3);sun.position.set(12,28,14);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-55,right:55,top:45,bottom:-35});scene.add(sun);
const physics=new Physics(()=>0), shared={uNight:{value:0}}, mat=createMaterials(shared), updates=[];
function rng(seed){let n=12345;return()=>{n=(Math.imul(n,1664525)+1013904223)|0;return(n>>>0)/4294967296;};}
const player={pos:new THREE.Vector3(),vel:new THREE.Vector3(),safe:{x:0,y:0,z:0},keys:new Set(),dom:renderer.domElement,inputLock:0,fly:false,riding:false,isUnderground:()=>false,setPose(x,z){this.pos.set(x,0,z);}};
const ctx={physics,scene,camera,shared,mat,tex:createTextures(),services:{},playerObj:player,audio:{context:null,muted:true},rng,
  L:{WORLD:{play:{x0:-60,x1:60,z0:-70,z1:90}},inPlay:(x,z)=>Math.abs(x)<60&&z>-70&&z<90,heightAt:()=>0,insideBuilding:()=>false},
  ui:{modalOpen:false,toast(text){document.querySelector('#toast').textContent=text;setTimeout(()=>document.querySelector('#toast').textContent='',1800);}},
  add(o){scene.add(o);},noOutline(){},onUpdate(fn){updates.push(fn);}};
function box(x,z,w,d,h,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat.toon(color));m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);physics.addBox(x,z,w,d,0,0,h);return m;}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(130,180),mat.toon('#616971'));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
box(0,14,10,.4,1.3,'#d4d1bb');
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,5,12),mat.toon('#566172'));pole.position.set(16.72,2.5,14);scene.add(pole);physics.addCylinder(16.72,14,.16,0,5);
const wrecks=await getCarWrecks(ctx);
const fleet=createFleet(ctx,{capacity:{sedan:8},persons:8});
const record=(x,c,color)=>({kind:'sedan',x,y:.03,z:14,c,s:0,color:new THREE.Color(color),plate:4,lamp:[.7,.4,0],driver:true,pax:false});
const parked=record(-16,1,'#57789f'),traffic=record(-32,-1,'#d6bf84'),arch=ARCH.sedan;
let parkedBox=physics.addBox(-16,14+(arch.front+arch.rear)/2,arch.wid,arch.len,0,0,arch.hgt);bindParkedImpact(parkedBox,parked,arch,wrecks);
const vehicle={v:12,brake:false}, moving={cx:-32,cz:14-(arch.front+arch.rear)/2,w:arch.wid,d:arch.len,rotY:Math.PI,y0:0,y1:arch.hgt};bindCarImpact(moving,vehicle,0,traffic,arch,wrecks);physics.addDynamic(()=>traffic.wrecked?[]:[moving]);
// Painted lane guides are yard-only fixtures; they do not alter city generators.
for(const x of [-32,-16,0,16])for(const side of [-1,1]){const line=new THREE.Mesh(new THREE.PlaneGeometry(.10,55),mat.toon('#d2cbb5'));line.rotation.x=-Math.PI/2;line.position.set(x+side*2.5,.01,0);scene.add(line);}
await buildDrive(ctx); const drive=ctx.drive;drive.enter();drive.teleport(0,0,0);
let inspection=true, paused=false, time=0, inspectOffset=[5.5,3,6.8], target=null;
addEventListener('keydown',e=>player.keys.add(e.code));addEventListener('keyup',e=>player.keys.delete(e.code));addEventListener('blur',()=>player.keys.clear());
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
const lab=window.lab={drive,ctx,renderer,vehicle,moving,fleet,parked,traffic,wrecks,
  inspect(on=true,offset=[5.5,3,6.8],focus=null){inspection=on;inspectOffset=offset;target=focus;},pause(on=true){paused=on;},
  reset(){wrecks.reset();for(const r of [parked,traffic]){if(r.wreckSource?.staticBox)physics.remove(r.wreckSource.staticBox);r.wrecked=false;r.wreckSource=null;r.wreckBody=null;r.z=14;r.y=.03;r.s=0;}parked.x=-16;parked.c=1;traffic.x=-32;traffic.c=-1;vehicle.wrecked=false;physics.remove(parkedBox);parkedBox=physics.addBox(-16,14+(arch.front+arch.rear)/2,arch.wid,arch.len,0,0,arch.hgt);bindParkedImpact(parkedBox,parked,arch,wrecks);drive.teleport(0,0,0);drive.repair();parked.damageState=createDamageState();traffic.damageState=createDamageState();inspection=true;target=null;},
  crash(kind='wall',speed=45,offset=0){const victim=kind==='parked'?parked:kind==='traffic'?traffic:null;const x=(victim?victim.x:{wall:0,pole:16}[kind])+offset;vehicle.v=12;if(!traffic.wrecked)bindCarImpact(moving,vehicle,time,traffic,arch,wrecks);drive.teleport(x,(victim?victim.z-14:0)+Math.max(0,10-speed*.28),0);drive.car.vz=speed;drive.sim(.6);inspection=true;target=null;return{damage:drive.damage.amount,smoke:drive.damage.smoke,spin:drive.car.impactSpin,x:drive.car.x,z:drive.car.z};},
  advance(dt){time+=dt;for(const fn of updates)fn(dt,time);},
};
for(const button of document.querySelectorAll('[data-stage]'))button.onclick=()=>{lab.reset();for(const speed of [8,15,21,30].slice(0,Number(button.dataset.stage)))lab.crash('wall',speed);drive.teleport(0,0,0);drive.sim(1/60);lab.inspect(true,[3.8,1.8,4.5]);};
for(const button of document.querySelectorAll('[data-case]'))button.onclick=()=>lab.crash(button.dataset.case);
document.querySelector('#reset').onclick=()=>lab.reset();document.querySelector('#view').onclick=()=>inspection=!inspection;
let previous=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-previous)/1000);previous=now;if(!paused)lab.advance(dt);if(inspection){const c=target||drive.car;camera.position.set(c.x+inspectOffset[0],inspectOffset[1],c.z+inspectOffset[2]);camera.lookAt(c.x,.7,c.z);camera.fov=48;camera.updateProjectionMatrix();}fleet.begin(camera);fleet.push(parked);fleet.push(traffic);fleet.end();renderer.render(scene,camera);}requestAnimationFrame(frame);
window.labReady=true;
</script></body></html>
